<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Orbit Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="globeViz"></div>

  <div id="topBar">
    <div class="brand">Orbit Tracker</div>
    <div class="clock" id="utcClock">—</div>
  </div>

  <div id="controls" class="panel">
    <h3>Location</h3>
    <label>Latitude <input type="number" id="lat" value="40.7128" step="0.0001"></label>
    <label>Longitude <input type="number" id="lon" value="-74.0060" step="0.0001"></label>
    <button id="findPasses">Find upcoming passes</button>
    <div id="passResults"></div>
  </div>

  <div id="satDetails" class="panel">
    <button id="closeDetails">&times;</button>
    <h3 id="detailsName">—</h3>
    <p id="detailsBlurb"></p>
    <div class="stat"><span class="label">NORAD ID</span><span id="detailsNorad">—</span></div>
    <div class="stat"><span class="label">Latitude</span><span id="detailsLat">—</span></div>
    <div class="stat"><span class="label">Longitude</span><span id="detailsLon">—</span></div>
    <div class="stat"><span class="label">Altitude</span><span id="detailsAlt">—</span></div>
    <div class="stat"><span class="label">Updated</span><span id="detailsUpdated">—</span></div>
  </div>

  <div id="statsBar">
    <span class="metric">sats <b id="statSatCount">—</b></span>
    <span class="metric">TLE age <b id="statTleAge">—</b>h</span>
    <span class="metric">pos calc <b id="statPosCalc">—</b>ms</span>
    <span class="metric">pass calc <b id="statPassCalc">—</b>ms</span>
    <span class="metric">requests <b id="statRequests">—</b></span>
  </div>

  <script src="https://unpkg.com/globe.gl"></script>
  <script src="app.js"></script>
</body>
</html>
