<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orbit Tracker: live satellite positions and pass prediction</title>
  <meta name="description" content="Live positions of 30 satellites on a 3D globe, with orbit paths and visible pass prediction for any location. Computed from CelesTrak TLEs with SGP4.">
  <meta name="theme-color" content="#0A0E14">
  <link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Orbit Tracker: live satellite positions and pass prediction">
  <meta property="og:description" content="Live positions of 30 satellites on a 3D globe, with orbit paths and visible pass prediction for any location.">
  <meta property="og:url" content="https://orbit-tracker-coral.vercel.app">
  <meta property="og:image" content="https://orbit-tracker-coral.vercel.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="globeViz"></div>

  <div id="topBar">
    <div class="brand">Orbit Tracker</div>
    <div id="search">
      <input type="text" id="searchInput" role="combobox" aria-label="Search satellites"
             aria-autocomplete="list" aria-controls="searchResults" aria-expanded="false"
             autocomplete="off" spellcheck="false" placeholder="Search name or NORAD ID  /">
      <div id="searchResults" role="listbox" aria-label="Matching satellites" hidden></div>
    </div>
    <button id="passesToggle" aria-controls="controls" aria-expanded="false">Passes</button>
    <div class="clock" id="utcClock">—</div>
  </div>

  <div id="controls" class="panel">
    <h3>Location</h3>
    <label>Latitude <input type="number" id="lat" value="40.7128" step="0.0001"></label>
    <label>Longitude <input type="number" id="lon" value="-74.0060" step="0.0001"></label>
    <button id="useLocation" class="secondary">Use my location</button>
    <div id="locationStatus" aria-live="polite"></div>
    <button id="findPasses">Find upcoming passes</button>
    <div id="passResults"></div>
  </div>

  <div id="satDetails" class="panel">
    <button id="closeDetails">&times;</button>
    <h3 id="detailsName">—</h3>
    <p id="detailsBlurb"></p>
    <div class="stat"><span class="label">NORAD ID</span><span id="detailsNorad">—</span></div>
    <div class="stat"><span class="label">Latitude</span><span id="detailsLat">—</span></div>
    <div class="stat"><span class="label">Longitude</span><span id="detailsLon">—</span></div>
    <div class="stat"><span class="label">Altitude</span><span id="detailsAlt">—</span></div>
    <div class="stat"><span class="label">Updated</span><span id="detailsUpdated">—</span></div>
  </div>

  <div id="statsBar">
    <span class="metric">sats <b id="statSatCount">—</b></span>
    <span class="metric">TLE age <b id="statTleAge">—</b>h</span>
    <span class="metric">pos calc <b id="statPosCalc">—</b>ms</span>
    <span class="metric">pass calc <b id="statPassCalc">—</b>ms</span>
    <span class="metric">requests <b id="statRequests">—</b></span>
  </div>

  <script src="https://unpkg.com/globe.gl@2.46.2"></script>
  <script src="app.js"></script>
</body>
</html>
